services:
  postgres:
    image: postgres:16-alpine
    container_name: car-rental-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: car_rental_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d car_rental_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - car-rental-net

  backend:
    build:
      context: ./car-rental-backend
    container_name: car-rental-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: car_rental_db
      JWT_SECRET: change_me_to_a_long_random_secret_for_demo
      JWT_EXPIRE: 7d
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "5000"
    networks:
      - car-rental-net

  frontend:
    build:
      context: ./car-rental-frontend
      args:
        REACT_APP_API_URL: /api
    container_name: car-rental-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - car-rental-net

  nginx:
    image: nginx:1.27-alpine
    container_name: car-rental-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - car-rental-net

volumes:
  postgres_data:

networks:
  car-rental-net:
    driver: bridge
